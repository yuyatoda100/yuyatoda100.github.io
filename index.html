<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホ表示に対応させるためのビューポート設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中高生向け 英語学習アプリ</title>
    <link rel="stylesheet" href="style.css">
    <!-- PWA用の設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">

    <!-- iOS (iPhone/Safari) 用の特別設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="英単語アプリ">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div id="app">
        <header>
            <h1>英単語マスター</h1>
        </header>

        <main id="quiz-container">
            <!-- ここにJavaScriptでクイズ画面を動的に描画していきます -->
            <p>アプリの準備中...</p>
        </main>
    </div>

    <!-- JavaScriptの読み込み（bodyの最後で読み込むことでDOM描画後の操作を確実にします） -->
    <script src="app.js"></script>
    <!-- Service Worker登録スクリプト -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(registration => {
                    console.log('Service Worker登録成功:', registration);
                })
                .catch(error => {
                    console.log('Service Worker登録失敗:', error);
                });
        }
    </script>
</body>
</html>
